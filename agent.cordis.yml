# The `dual-constraint-warmup-standard` experimental preset: TWO constraints
# on the first request — (1) the Minimal preset's tool pair
# (bash + str_replace_editor), (2) a 1024-token output cap — plus context
# stripping, then a MULTI-TURN cap schedule that keeps the budget tight for
# several turns after promotion to build trajectory inertia (style stays
# "We need..."-like across turns, not just on the first round). After the
# schedule releases the cap, the model works with full budget + full tool
# catalog.
#
# DIFFERS FROM UPSTREAM `anchored-standard`:
#   - bootstrapMaxTokens defaults to 1024 (the user's dual-constraint addition);
#     upstream leaves it unset and relies on the Minimal schema at 256000.
#   - capSchedule extends the cap across multiple turns (default 1024/1024/
#     4096/release) to build style inertia; upstream releases the cap the
#     moment the session promotes.
#   - Post-promotion defaults to releasing the FULL 25-tool Standard catalog
#     (`postPromotionMode: full`); upstream narrows to a "resident set"
#     (bootstrap pair + 3 discovery tools + unlocked). This preset supports
#     both modes via `postPromotionMode` (full / resident) for A/B testing.
#   - The upstream's `instruction-hint.mjs`, `skill-search.mjs`, and
#     `dev-tool-search.mjs` are OMITTED: the full AGENTS.md digest and
#     skill catalog return from request #2 on (matching the standard
#     Standard preset behavior). The `dsh-agent-instructions` and
#     `dsh-tool-skill` rows are MOUNTED so their injections exist for the
#     post-promotion phase; the bootstrap filter strips them from request #1.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount.

# ── bootstrap (must stay FIRST) ─────────────────────────────────────────────

# TWO anchors on the first request, extended into a THREE-PHASE pre-user
# warmup that fixes the reasoning-chain STYLE before any real work:
#
#   Phase A — Warmup round (turn 1): the session's first step is replaced
#     with one synthetic message ("This round is a test..."), presented with
#     the Minimal tool pair (bash + str_replace_editor) and the tight
#     bootstrap cap (1024). When `replayFile` is configured, the warmup
#     round's model output is short-circuited through `llm/stream` with a
#     pre-recorded "We need..."-style reasoning + reply, so the anchor is
#     DETERMINISTIC and costs ZERO adapter calls. Context is stripped
#     (AGENTS.md digest + skill catalog).
#
#   Phase B — Test round (turn 2): a second synthetic message exercises the
#     model with the FULL Standard catalog under a mid cap (4096). This is
#     the "test" that consolidates the style: the model genuinely uses many
#     tools under a budget, building the "minimal thinking + multi-tool"
#     habit in a real working scenario.
#
#   Phase C — User round (turn 3+): the user's actual input enters with the
#     full catalog and the output budget RELEASED (adapter default flows).
#     The user never hits the truncation wall: the cap ladder was consumed
#     by the warmup/test rounds, and real work starts with full budget.
#
# The capSchedule counts MODEL REQUEST rounds (warmup=1, test=2, user=3+),
# epoch-aware: a mid-session compaction restarts the schedule AND re-arms
# the warmup/test phase (the post-compaction "second first request" gets
# the same anchoring treatment).
#
# After the first durable tool/call OR first assistant/message (`promoteOn:
# either`), promote and release the configured post-promotion catalog
# (`postPromotionMode: full` = all 25 Standard tools). The cap schedule is
# independent of promotion — it governs the budget per turn regardless of
# which tool catalog is visible.
#
# After compaction/end, fall back to the controlled phase (bootstrap pair +
# compactionTools) until a NEW durable signal exists past the boundary
# (epoch-aware, see compaction-epoch.mjs). The cap schedule also restarts
# at turn 1 of the new epoch.
- id: dual-tool-bootstrap
  name: ./dual-tool-bootstrap.mjs
  config:
    bootstrapTools: [bash, str_replace_editor]
    bootstrapMaxTokens: 1024
    # Synthetic warmup (Phase A) and test (Phase B) messages.
    warmupMessage: 'This round is a test. Tools are not open yet; all tools will open next round.'
    testMessage: 'Test round: tools are now fully open. Keep your reasoning concise and work through this test task using the available tools.'
    # Optional pre-recorded warmup output (Phase A replay, 0 adapter calls).
    # When present, the warmup round replays this file's reasoning + reply
    # through `llm/stream` instead of calling the model — deterministic
    # anchor, zero cost. Delete this key to run the warmup through the real
    # model instead.
    replayFile: ./replay.json
    # Multi-turn cap schedule (the inertia extension). Keys are 1-based turn
    # numbers; values are the maxTokens cap for that turn. Turns NOT listed
    # release the cap (the adapter default flows). Omit this key entirely to
    # use the legacy single-cap behavior (cap while unpromoted, release on
    # promotion).
    #
    # v2 schedule — pre-user warmup/test ladder, then release:
    #   turn 1: 1024  (Phase A warmup anchor — concise "We need..." opening)
    #   turn 2: 4096  (Phase B test — full tools under a mid budget,
    #                  consolidates the "minimal thinking + multi-tool" habit)
    #   turn 3+: released (Phase C — the user's real input starts with the
    #                  full budget; the cap ladder is already consumed, so
    #                  real work is never truncated by the warmup cap)
    capSchedule:
      1: 1024
      2: 4096
    promoteOn: either
    suppressedContextSources: [agent-instructions, skill-catalog]
    postPromotionMode: full
    # Post-compaction core work set: the model is mid-task and needs to keep
    # working, but faces a small catalog instead of the full Standard set.
    compactionTools: [read, write, edit, glob, grep, todo_write, ask_user_question]

# ── identity ────────────────────────────────────────────────────────────────

# Keep this text byte-identical to the Minimal preset. `complete` prevents
# the Harness identity and per-tool guidance from changing the system prompt.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a helpful software engineer assistant.
    complete: true
    includeRuntimeContext: false

# ── workspace instructions (RESTORED vs upstream) ───────────────────────────

# RESTORED vs upstream `anchored-standard`: the upstream replaced
# dsh-agent-instructions with `instruction-hint.mjs` (a one-shot "these files
# exist, read them yourself" message). This preset KEEPS the full
# AGENTS.md/CLAUDE.md workspace digest injection for the post-promotion
# phase, matching the standard Standard preset behavior. The bootstrap filter
# strips it from request #1 only.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it
# to publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a
# service is the criterion for host-plane ownership — injection resolves
# before any session exists, so there is no agent to key by.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  # Disabled on EVERY platform: `dsh-tool-bash-persistent` below registers
  # the same `bash` tool name into this same preset layer, and the tools
  # registry rejects duplicates within one layer.
  disabled: true

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# The Minimal preset's shell: a PTY-backed persistent bash, byte-identical
# in configuration to the official `minimal` preset's `persistent-shell`
# group. The PTY registry is an agent-owned service, so it lives in an
# entry-local realm; the backend still consumes the host sandbox policy and
# subprocess implementation.
#
# DISABLED ON WINDOWS: DSH's PTY backend is linux/darwin-only. The
# `custom-bash` row below registers the same `bash` tool name there
# (platform-exclusive).
- id: persistent-shell
  name: cordis:group
  group: true
  disabled: !!js process.platform === 'win32'
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * You do have access to a mirror of common linux and python packages via apt and pip.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

# Windows-only `bash` tool (see ./custom-bash.mjs): same tool name as the
# persistent shell with a Minimal-compatible description, executes through
# `bash -c` via the cross-platform subprocess seam (no PTY). `bashPath`
# defaults to `bash` on PATH; point it at Git Bash explicitly when the WSL
# shim would otherwise be picked up. No OS sandbox confinement on Windows.
- id: custom-bash
  name: ./custom-bash.mjs
  disabled: !!js process.platform !== 'win32'
  config:
    bashPath: 'C:\Program Files\Git\bin\bash.exe'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they
# need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# The Minimal preset's second tool: `str_replace_editor` over a local
# filesystem, byte-identical in configuration to the official `minimal`
# preset's `filesystem` group. The editor's own realm shadows the host's
# sandboxed `fs` provider only inside this group, so the standard
# `read`/`write`/`edit` tools keep the sandboxed fs while the bootstrap
# editor uses the local one.
- id: bootstrap-filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# RESTORED vs upstream: dsh-tool-skill is MOUNTED so the standard ~9KB
# `<available_skills>` reminder returns from request #2 on. The upstream
# replaced it with `skill-search.mjs` (on-demand `skill_search` / `skill_load`
# tools) to avoid the large injection. This preset keeps the standard
# behavior: the bootstrap filter strips the catalog from request #1, then
# it returns normally from request #2 on. To switch to the on-demand tool
# pattern instead, copy this preset and replace this row with
# `./skill-search.mjs` (you would also need to bring that plugin over from
# the upstream repo).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry lives in the HOST composition; this preset
# contributes the delegation TOOLS, which resolve that host registry.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
